name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        if: env.SIGNING_CERT_P12 != ''
        run: |
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Check tag matches app version
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          if [[ "v$app_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $app_version"
            exit 1
          fi

      - run: ./build.sh

      - run: ditto -c -k --keepParent build/ISOFix.app ISOFix.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ISOFix.zip --title "ISOFix ${GITHUB_REF_NAME#v}" --generate-notes
